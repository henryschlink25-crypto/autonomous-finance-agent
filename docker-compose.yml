version: '3.8'

services:
  trading-agent:
    build: .
    container_name: autonomous-trading-agent
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Live-Code-Mount für sofortige Aktualisierungen
      - .:/app
      # Dauerhafte Speicherung der Lern-Zustände, Strategien und Transaktions-Logs
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
